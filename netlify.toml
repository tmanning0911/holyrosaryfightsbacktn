[build]
  publish = "."
  functions = "netlify/functions"
  command = "npm install --omit=dev"

[functions]
  node_bundler = "esbuild"
  included_files = ["netlify/lib/**", "email-previews/welcome.html", "email-previews/press-release-media-pitch.html"]
  external_node_modules = ["@netlify/blobs"]

[functions."petition-refresh"]
  schedule = "*/15 * * * *"

[[redirects]]
  from = "https://www.holyrosaryfightsbacktn.com/*"
  to = "https://holyrosaryfightsbacktn.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/api/petition-count"
  to = "/.netlify/functions/petition-count"
  status = 200

[[redirects]]
  from = "/api/petition-feed"
  to = "/.netlify/functions/petition-count"
  status = 200

[[redirects]]
  from = "/api/welcome-send"
  to = "/.netlify/functions/welcome-send"
  status = 200

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/resend-inbound"
  to = "/.netlify/functions/resend-inbound"
  status = 200

[[redirects]]
  from = "/pastor"
  to = "/clark.html"
  status = 200

[[redirects]]
  from = "/pastor/"
  to = "/clark.html"
  status = 200

[[redirects]]
  from = "/clark"
  to = "/clark.html"
  status = 301

[[redirects]]
  from = "/ramsfightback"
  to = "https://c.org/2LMccZY9dk"
  status = 302
  force = true

[[redirects]]
  from = "/ramsfightback/"
  to = "https://c.org/2LMccZY9dk"
  status = 302
  force = true

[[redirects]]
  from = "/sign"
  to = "https://c.org/2LMccZY9dk"
  status = 302
  force = true

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Content-Type-Options = "nosniff"
    Permissions-Policy = "geolocation=(), microphone=(), camera=()"
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/sitemap.xml"
  [headers.values]
    Content-Type = "application/xml; charset=UTF-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/robots.txt"
  [headers.values]
    Content-Type = "text/plain; charset=UTF-8"
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/img/*"
  [headers.values]
    Cache-Control = "public, max-age=86400"
